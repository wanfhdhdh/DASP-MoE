model:
  kwargs:
    type: MMBSN
    pd_a: 5
    pd_b: 2
    pd_pad: 2
    R3: True
    R3_T: 8
    R3_p: 0.16
    in_ch: 3
    bsn_base_ch: 128
    bsn_num_module: 9
    DCL1_num: 2
    DCL2_num: 7
    # 掩膜组合
    mask_type: 'o_a45_deephui_thick45'
    
    # ============ [MoE 参数] ============
    extend_large: True   # 开启大核
    use_moe: True        # 开启 MoE
    hard_moe: True       # True=Top2硬路由, False=软路由
    
    # ============ [新增 DINOv2 语义引导参数] ============
    use_semantic: True        # 启用语义引导
    semantic_encoder_type: 'DINOv2_ViT_Small'  # 使用DINOv2 ViT-Small

model_input: ['noisy']

trainer: Trainer

training:
  dataset: preped_RN_data
  dataset_args:
    crop_size: [160, 160]
    aug: ['hflip', 'rot']
    n_repeat: 4
  
  batch_size: 4
  max_epoch: 45
  init_lr: 1e-4
  warmup: False
  
  scheduler:
    type: step
    step:
      step_size: 8
      gamma: 0.1
  loss: 1*self_L1
  tmp_info: []
  optimizer:
    type: Adam
    Adam:
      betas: [0.9, 0.999]
      warmup: False
      warmup_iter: 200

validation:
  dataset: DEBRIS_test
  dataset_args:
    crop_size: None
    n_data: null
  
  add_con: 0.5
  floor: True
  
  val: True
  save_image: True
  start_epoch: 1
  interval_epoch: 1

checkpoint:
  save: True
  start_epoch: 1
  interval_epoch: 1

log:
  interval_iter: 10
test:
  dataset: 'DEBRIS_Test'
  dataset_args:
    crop_size: null
    n_data: null
  
  add_con: 0.5
  floor: True
  save_image: True